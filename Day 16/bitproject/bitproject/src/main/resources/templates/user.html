<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit Project 2024 | User Management</title>

    <link rel="icon" href="/images/sun.png">
    <!--link D5-1 css file-->
    <link rel="stylesheet" href="/css/employee.css">

    <!--link fontawesome css file-->
    <link rel="stylesheet" href="/fontawesome-free-6.6.0/css/all.min.css">

    <!--link bootstrap files-->
    <link href="/bootstrap-5.2.3/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="/bootstrap-5.2.3/css/bootstrap.min.css">
    <script src="/bootstrap-5.2.3/js/bootstrap.bundle.min.js"></script>

    <script src="/jquery/jquery-3.7.1.min.js"></script>

    <!--Link data tables files-->
    <link href="/datatables/datatables.min.css" rel="stylesheet">
    <script src="/datatables/datatables.min.js"></script>
</head>

<body>

    <div class="container-fluid">
        <!-- title area -->
        <div class="row m-2">
            <div class="col-12 text-center fw-bold p-2 title">
                <h2>User Management<h2>
            </div>
        </div>
        <!-- end title area -->

        <!--Start form-->
        <div class="row mt-2">
            <div class="col-5">
                <div class="card">
                    <div class="card-body">
                        <form onsubmit="return false" id="formUser">

                            <!-- Required Mark -->
                            <div class="row mt-1">
                                <div class="col text-end fw-bold">
                                    <p>Required<span class="text-danger">*</span></p>
                                </div>
                            </div>
                            <!-- end Required Mark -->

                            <!--Employee-->
                            <div class="row mt-2">
                                <label for="selectEmployee" class="col-4 form-label fw-bold">Employee:<span
                                        class="text-danger">*</span></label>
                                <div class="col-8">
                                    <select required id="selectEmployee" class="form-select"></select>
                                </div>

                            </div>
                            <!--End Employee-->

                            <!--Username-->
                            <div class="row mt-2">
                                <label for="textUsername" class="col-4 form-label fw-bold mt-2">Username:<span
                                        class="text-danger">*</span></label>
                                <div class="col-8">
                                    <input type="text" required placeholder="Enter Username" id="textUsername"
                                        class="form-control">
                                </div>

                            </div>
                            <!--Username-->

                            <!--Password-->
                            <div class="row mt-2">
                                <label for="textPassword" class="col-4 form-label fw-bold mt-2">Password:<span
                                        class="text-danger">*</span></label>
                                <div class="col-8">
                                    <input type="password" required placeholder="Enter Password" id="textPassword"
                                        class="form-control">
                                </div>

                            </div>
                            <!--Password-->

                            <!--ReTypePassword-->
                            <div class="row mt-2">
                                <label for="textReTypePassword" class="col-4 form-label fw-bold mt-2">Re-Type
                                    Password:<span class="text-danger">*</span></label>
                                <div class="col-8">
                                    <input type="password" required placeholder="Retype Password"
                                        id="textReTypePassword" class="form-control">
                                </div>

                            </div>
                            <!--RetypePassword-->

                            <!--Email-->
                            <div class="row mt-2">
                                <label for="textEmail" class="col-4 form-label fw-bold mt-2">Email:<span
                                        class="text-danger">*</span></label>
                                <div class="col-8">
                                    <input type="email" required placeholder="Enter Email" id="textEmail"
                                        class="form-control">
                                </div>

                            </div>
                            <!--Email-->

                            <!--Roles-->
                            <div class="row mt-2">
                                <label for="textEmail" class="col-4 form-label fw-bold mt-2">Roles:<span
                                        class="text-danger">*</span></label>
                                <div id="divRoles">
                                    <div class="form-check form-check-inline">
                                        <input type="checkbox" id="checkBoxRole" class="form-check-input">
                                        <label for="checkBoxRole" class=" form-check-label fw-bold">
                                            Manager
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input type="checkbox" id="checkBoxRole" class="form-check-input">
                                        <label for="checkBoxRole" class=" form-check-label fw-bold">
                                            cashier
                                        </label>
                                    </div>

                                </div>


                            </div>
                            <!--Roles-->

                            <!--Note-->
                            <div class="row mt-2">
                                <label for="textNote" class="col-4 form-label fw-bold mt-2">Note:</label>
                                <div class="col-8">
                                    <textarea placeholder="Enter --Note--" id="textNote"
                                        class="form-control"></textarea>
                                </div>

                            </div>
                            <!--Note-->


                            <!--Status-->
                            <div class="row mt-2">
                                <label for="selectModule" class="col-4 form-label fw-bold mt-2">User Status:
                                    <span class="text-danger">*</span></label>
                                <div class="col-8">
                                    <div class="form-check form-check-inline">
                                        <input type="checkbox" id="checkBoxUserStatus" class="form-check-input">
                                        <label for="checkBoxUserStatus" checked class="form-check-label fw-bold">User
                                            account is active</label>
                                    </div>

                                </div>
                            </div>

                                <!--Status-->





                                <!--start buttons -->
                                <div class="row mt-2">
                                    <div class="col-4">
                                        <button class="btn btn-danger me-2 fw-bold" type="button">Clear</button>
                                    </div>

                                    <div class="col-8 text-end">
                                        <button class="btn btn-warning me-2 fw-bold" type="submit">Update</button>
                                        <button class="btn btn-success me-2 fw-bold" type="submit">Submit</button>
                                    </div>
                                </div>
                                <!--end buttons -->
                        </form>

                    </div>

                </div>
            </div>

            <!--Start Table-->
            <div class="col-7">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-hover table-striped table-bordered" id="tableUser">
                            <thead class="table-dark">
                                <th>#</th>
                                <th>Employee</th>
                                <th>User Name</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th>Status</th>
                                <th>Modify</th>

                            </thead>
                            <tbody id="tableBodyUser">

                            </tbody>
                        </table>

                    </div>

                </div>

            </div>
        </div>
    </div>

    </div>
    <script src="/script/reusableTableFunction.js"></script>
        <script src="/script/common.js"></script>
        <script src="/uicontroller/employee.js"></script>
        <script src="/script/validationFunction.js"></script>
</body>

</html>
